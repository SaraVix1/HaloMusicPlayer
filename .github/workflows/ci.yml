name: CI

# Checks every branch push (feature branches and main) and every PR into main.
# Tag pushes are handled by release.yml, so they are excluded here.
on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch cancels the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Linux support targets Debian: the current release and the one before.
  rust-linux:
    name: Rust (${{ matrix.label }} — ${{ matrix.clippy && 'check, clippy, test' || 'check, test' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'debian:bookworm', label: 'Debian 12', clippy: true }
          - { image: 'debian:trixie', label: 'Debian 13', clippy: false }
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      # Before checkout, so checkout finds git (the image has none).
      - name: Install Linux system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config \
            libasound2-dev \
            libdbus-1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev

      - uses: actions/checkout@v5

      # The .deb's Depends (crates/halo-app/Cargo.toml, one line) must be
      # installable on this release — catches renamed packages (t64 …).
      - name: .deb dependencies resolve
        run: |
          deps=$(sed -n 's/^depends = \[\(.*\)\]$/\1/p' crates/halo-app/Cargo.toml | sed 's/", "/, /g; s/"//g')
          echo "Depends: $deps"
          test -n "$deps"
          apt-get satisfy -s "$deps"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: ${{ matrix.image }}

      - name: cargo check
        run: cargo check --workspace --all-targets --locked

      # Report-only for now: the codebase has pre-existing clippy warnings.
      # Switch to `-- -D warnings` once they are cleaned up.
      - name: cargo clippy
        if: matrix.clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: cargo test
        run: cargo test --workspace --locked

  rust-windows:
    name: Rust (Windows — check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      # Compiles the cfg(windows) paths (SMTC/AUMID, HWND, icon embedding, …) that the
      # Linux job never sees.
      - name: cargo check
        run: cargo check --workspace --all-targets --locked
