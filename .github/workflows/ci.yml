name: CI

# Checks every branch push (feature branches and main) and every PR into main.
# Tag pushes are handled by release.yml, so they are excluded here.
on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch cancels the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-linux:
    name: Rust (Linux — check, clippy, test)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libdbus-1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: cargo check
        run: cargo check --workspace --all-targets --locked

      # Report-only for now: the codebase has pre-existing clippy warnings.
      # Switch to `-- -D warnings` once they are cleaned up.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: cargo test
        run: cargo test --workspace --locked

  rust-windows:
    name: Rust (Windows — check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      # Compiles the cfg(windows) paths (SMTC/AUMID, HWND, icon embedding, …) that the
      # Linux job never sees.
      - name: cargo check
        run: cargo check --workspace --all-targets --locked
