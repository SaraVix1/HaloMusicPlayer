name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - uses: actions/checkout@v5
      # A v* tag push releases that tag. A manual run from main releases the
      # current version: it creates the tag v<version from tauri.conf.json>
      # on this commit. Manual runs from any other branch are refused.
      - name: Create draft release
        id: create-release
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs')
            const { owner, repo } = context.repo
            let tag
            if (context.ref.startsWith('refs/tags/v')) {
              tag = context.ref.replace('refs/tags/', '')
            } else if (context.ref === 'refs/heads/main') {
              const { version } = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'))
              tag = `v${version}`
              const existing = await github.rest.git
                .getRef({ owner, repo, ref: `tags/${tag}` })
                .catch((e) => (e.status === 404 ? null : Promise.reject(e)))
              if (existing) {
                core.setFailed(`Tag ${tag} already exists. Push a new commit to main (it bumps the version) and run again.`)
                return
              }
            } else {
              core.setFailed(`Release must run from main or a v* tag, not ${context.ref}`)
              return
            }
            const { data } = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `${tag} (Beta)`,
              draft: true,
              // Halo is in beta — publish every release as a pre-release
              prerelease: true,
            })
            return data.id

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows MSI
          - platform: windows-latest
            args: ''
          # Linux AppImage, .deb, .rpm (all produced by one build via bundle.targets: "all")
          - platform: ubuntu-22.04
            args: ''
          # macOS — Intel + Apple Silicon
          - platform: macos-latest
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies (deb/rpm/AppImage build deps)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            rpm \
            file

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
            })
