name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result && fromJSON(steps.create-release.outputs.result).id }}
      tag: ${{ steps.create-release.outputs.result && fromJSON(steps.create-release.outputs.result).tag }}
    steps:
      - uses: actions/checkout@v5
      # What gets released:
      # - a v* tag push releases that tag;
      # - a manual run from main releases the current version: it creates the
      #   tag v<[workspace.package] version> on this commit;
      # - a manual run from any other branch releases a branch build: it
      #   creates the semver pre-release tag v<version>-<branch>.<run number>
      #   (e.g. v0.1.3-iced-port.12) on this commit, never marked "Latest".
      - name: Create draft release
        id: create-release
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs')
            const { owner, repo } = context.repo

            const readVersion = () => {
              const toml = fs.readFileSync('Cargo.toml', 'utf8')
              const m = /\[workspace\.package\][^\[]*?\nversion\s*=\s*"([^"]+)"/.exec(toml)
              if (!m) throw new Error('version not found in [workspace.package] of Cargo.toml')
              return m[1]
            }
            const tagExists = async (t) =>
              !!(await github.rest.git
                .getRef({ owner, repo, ref: `tags/${t}` })
                .catch((e) => (e.status === 404 ? null : Promise.reject(e))))

            let tag
            let name
            let branchBuild = false
            if (context.ref.startsWith('refs/tags/v')) {
              tag = context.ref.replace('refs/tags/', '')
              name = `${tag} (Beta)`
            } else if (context.ref === 'refs/heads/main') {
              tag = `v${readVersion()}`
              name = `${tag} (Beta)`
              if (await tagExists(tag)) {
                core.setFailed(`Tag ${tag} already exists. Push a new commit to main (it bumps the version) and run again.`)
                return
              }
            } else if (context.ref.startsWith('refs/heads/')) {
              const branch = context.ref.replace('refs/heads/', '')
              // Semver pre-release identifiers: [0-9A-Za-z-] separated by dots.
              const slug = branch.replace(/[^0-9A-Za-z-]+/g, '-').replace(/^-+|-+$/g, '') || 'branch'
              tag = `v${readVersion()}-${slug}.${context.runNumber}`
              name = `${tag} (Beta, ${branch} branch build)`
              branchBuild = true
              if (await tagExists(tag)) {
                core.setFailed(`Tag ${tag} already exists.`)
                return
              }
            } else {
              core.setFailed(`Release must run from a branch or a v* tag, not ${context.ref}`)
              return
            }

            const { data } = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: context.sha,
              name,
              body: branchBuild
                ? `Branch build of \`${context.ref.replace('refs/heads/', '')}\` at ${context.sha.slice(0, 7)} — for testing; not a regular release.`
                : undefined,
              draft: true,
              // Halo is in beta — publish every release as a pre-release
              prerelease: true,
              // Branch builds must never become the "Latest" release.
              make_latest: branchBuild ? 'false' : 'legacy',
            })
            return { id: data.id, tag }

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: NSIS setup .exe + MSI
          - platform: windows-latest
            formats: nsis,wix
          # Linux: .deb + AppImage
          - platform: ubuntu-22.04
            formats: deb,appimage
          # macOS: universal (Intel + Apple Silicon) .app + .dmg
          - platform: macos-latest
            formats: app,dmg

    runs-on: ${{ matrix.platform }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libdbus-1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libfuse2 \
            file

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Build (Windows / Linux)
        if: runner.os != 'macOS'
        run: cargo build --release -p halo --locked

      - name: Build universal binary (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo build --release -p halo --locked --target aarch64-apple-darwin
          cargo build --release -p halo --locked --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/halo \
            target/aarch64-apple-darwin/release/halo \
            target/x86_64-apple-darwin/release/halo

      - name: Package
        run: cargo packager --release -p halo --formats ${{ matrix.formats }}

      - name: Upload release assets
        shell: bash
        run: |
          shopt -s nullglob
          files=(target/release/*.exe target/release/*.msi target/release/*.deb \
                 target/release/*.AppImage target/release/*.dmg)
          # Keep the main binary out of the upload on Windows (halo.exe).
          upload=()
          for f in "${files[@]}"; do
            [[ "$(basename "$f")" == "halo.exe" ]] && continue
            upload+=("$f")
          done
          if [ ${#upload[@]} -eq 0 ]; then
            echo "no packages produced" >&2
            ls -la target/release
            exit 1
          fi
          gh release upload "${{ needs.create-release.outputs.tag }}" "${upload[@]}" --clobber

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
            })
