[package]
name = "halo"
description = "Halo Music Player — a desktop music player"
version.workspace = true
authors.workspace = true
edition.workspace = true
default-run = "halo"

[[bin]]
name = "halo"
path = "src/main.rs"

[dependencies]
halo-backend = { path = "../halo-backend" }
halo-core = { path = "../halo-core" }
iced = { version = "0.14", features = ["tokio", "image", "svg", "canvas", "advanced"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
open = "5"
interprocess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.21"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
ureq = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# ── Installers (cargo-packager) ───────────────────────────────────────────────
# `cargo install cargo-packager --locked`, then from the repo root:
#   cargo build --release -p halo && cargo packager --release -p halo
# Produces NSIS/MSI (Windows), .deb/AppImage (Linux), .app/.dmg (macOS).
[package.metadata.packager]
productName = "Halo Music Player"
identifier = "com.saravix.halo"
publisher = "Saravix"
category = "Music"
description = "A desktop music player"
binaries = [{ path = "halo", main = true }]
icons = [
    "assets/icons/32x32.png",
    "assets/icons/128x128.png",
    "assets/icons/64x64.png",
    "assets/icons/icon.png",
    "assets/icons/icon.icns",
    "assets/icons/icon.ico",
]
formats = ["nsis", "wix", "deb", "appimage", "dmg", "app"]
# Keep in sync with halo_backend::open_files::PLAYABLE_EXTENSIONS.
fileAssociations = [
    { extensions = ["mp3"], mimeType = "audio/mpeg", name = "MP3 Audio", description = "MP3 Audio", role = "viewer" },
    { extensions = ["flac"], mimeType = "audio/flac;audio/x-flac", name = "FLAC Audio", description = "FLAC Audio", role = "viewer" },
    { extensions = ["m4a"], mimeType = "audio/mp4;audio/x-m4a", name = "MPEG-4 Audio", description = "MPEG-4 Audio", role = "viewer" },
    { extensions = ["aac"], mimeType = "audio/aac", name = "AAC Audio", description = "AAC Audio", role = "viewer" },
    { extensions = ["ogg", "oga"], mimeType = "audio/ogg;audio/x-vorbis+ogg;audio/x-flac+ogg", name = "Ogg Audio", description = "Ogg Audio", role = "viewer" },
    { extensions = ["wav"], mimeType = "audio/vnd.wave;audio/x-wav;audio/wav", name = "WAV Audio", description = "WAV Audio", role = "viewer" },
    { extensions = ["aiff", "aif"], mimeType = "audio/x-aiff;audio/aiff", name = "AIFF Audio", description = "AIFF Audio", role = "viewer" },
]

[package.metadata.packager.deb]
desktopTemplate = "linux/halo.desktop.hbs"
depends = ["libasound2", "libgtk-3-0", "libayatana-appindicator3-1", "libxdo3"]

[package.metadata.packager.nsis]
installMode = "currentUser"

# ── RPM (cargo-generate-rpm; cargo-packager has no rpm format) ────────────────
# `cargo install cargo-generate-rpm --locked`, then from the repo root:
#   cargo build --release -p halo && cargo generate-rpm -p crates/halo-app
# Output: target/generate-rpm/halo-<version>-1.x86_64.rpm. Same files as the
# .deb; linux/rpm/halo.desktop is the rendered linux/halo.desktop.hbs — keep
# the two in sync.
#
# Requirements are the binary's direct NEEDED libraries (`readelf -d`) plus
# the ones winit loads at runtime, named by soname so any RPM distro
# (Fedora, openSUSE, …) resolves them. auto-req is off: it walks ldd's full
# transitive list, which bakes in build-host sonames (e.g. Ubuntu's
# libjpeg.so.8) that other distros don't ship. The tray's appindicator
# library is loaded at runtime and optional, so it is only recommended.
[package.metadata.generate-rpm]
name = "halo"
summary = "Halo Music Player — a desktop music player"
# The repository has no licence file, so the RPM says so; change this if one
# is added (and set `license` in [workspace.package]).
license = "Proprietary"
auto-req = "disabled"
assets = [
    { source = "target/release/halo", dest = "/usr/bin/halo", mode = "755" },
    { source = "linux/rpm/halo.desktop", dest = "/usr/share/applications/halo.desktop", mode = "644" },
    { source = "assets/icons/32x32.png", dest = "/usr/share/icons/hicolor/32x32/apps/halo.png", mode = "644" },
    { source = "assets/icons/64x64.png", dest = "/usr/share/icons/hicolor/64x64/apps/halo.png", mode = "644" },
    { source = "assets/icons/128x128.png", dest = "/usr/share/icons/hicolor/128x128/apps/halo.png", mode = "644" },
    { source = "assets/icons/128x128@2x.png", dest = "/usr/share/icons/hicolor/256x256/apps/halo.png", mode = "644" },
    { source = "assets/icons/icon.png", dest = "/usr/share/icons/hicolor/512x512/apps/halo.png", mode = "644" },
]

[package.metadata.generate-rpm.requires]
"libasound.so.2()(64bit)" = "*"
"libdbus-1.so.3()(64bit)" = "*"
"libgtk-3.so.0()(64bit)" = "*"
"libxdo.so.3()(64bit)" = "*"
"libxkbcommon.so.0()(64bit)" = "*"
"libxkbcommon-x11.so.0()(64bit)" = "*"

[package.metadata.generate-rpm.recommends]
libayatana-appindicator-gtk3 = "*"
