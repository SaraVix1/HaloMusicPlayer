[package]
name = "halo"
description = "Halo Music Player — a desktop music player"
version.workspace = true
authors.workspace = true
edition.workspace = true
default-run = "halo"

[[bin]]
name = "halo"
path = "src/main.rs"

[dependencies]
halo-backend = { path = "../halo-backend" }
halo-core = { path = "../halo-core" }
iced = { version = "0.14", features = ["tokio", "image", "svg", "canvas", "advanced"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
open = "5"
interprocess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.21"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
ureq = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# ── Installers (cargo-packager) ───────────────────────────────────────────────
# `cargo install cargo-packager --locked`, then from the repo root:
#   cargo build --release -p halo && cargo packager --release -p halo
# Produces NSIS/MSI (Windows), .deb/AppImage (Linux), .app/.dmg (macOS).
[package.metadata.packager]
productName = "Halo Music Player"
identifier = "com.saravix.halo"
publisher = "Saravix"
category = "Music"
description = "A desktop music player"
binaries = [{ path = "halo", main = true }]
icons = [
    "assets/icons/32x32.png",
    "assets/icons/128x128.png",
    "assets/icons/64x64.png",
    "assets/icons/icon.png",
    "assets/icons/icon.icns",
    "assets/icons/icon.ico",
]
formats = ["nsis", "wix", "deb", "appimage", "dmg", "app"]
# Keep in sync with halo_backend::open_files::PLAYABLE_EXTENSIONS.
fileAssociations = [
    { extensions = ["mp3"], mimeType = "audio/mpeg", name = "MP3 Audio", description = "MP3 Audio", role = "viewer" },
    { extensions = ["flac"], mimeType = "audio/flac;audio/x-flac", name = "FLAC Audio", description = "FLAC Audio", role = "viewer" },
    { extensions = ["m4a"], mimeType = "audio/mp4;audio/x-m4a", name = "MPEG-4 Audio", description = "MPEG-4 Audio", role = "viewer" },
    { extensions = ["aac"], mimeType = "audio/aac", name = "AAC Audio", description = "AAC Audio", role = "viewer" },
    { extensions = ["ogg", "oga"], mimeType = "audio/ogg;audio/x-vorbis+ogg;audio/x-flac+ogg", name = "Ogg Audio", description = "Ogg Audio", role = "viewer" },
    { extensions = ["wav"], mimeType = "audio/vnd.wave;audio/x-wav;audio/wav", name = "WAV Audio", description = "WAV Audio", role = "viewer" },
    { extensions = ["aiff", "aif"], mimeType = "audio/x-aiff;audio/aiff", name = "AIFF Audio", description = "AIFF Audio", role = "viewer" },
]

[package.metadata.packager.deb]
desktopTemplate = "linux/halo.desktop.hbs"
depends = ["libasound2", "libgtk-3-0", "libayatana-appindicator3-1", "libxdo3"]

[package.metadata.packager.nsis]
installMode = "currentUser"
